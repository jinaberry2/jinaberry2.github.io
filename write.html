<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 글 작성</title>
    <link rel="stylesheet" href="write.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon_io/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon_io/favicon-16x16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/favicon_io/apple-touch-icon.png" sizes="180x180">
    
    <!-- 🌟 강력한 자동 로그인 및 0506 패스 마스터 가드 -->
    <!-- 🌟 무한 루프 핑퐁을 완벽히 해결한 강력한 마스터 가드 스크립트 -->
<script>
    (function() {
        // 1. [최우선 검사] 전체 회원 로그인 상태 체크
        const sessionUserData = localStorage.getItem('loggedInUser');
        if (!sessionUserData) {
            // 회원 로그인이 없으면 '즉시' 로그인창(index.html)으로 추방하고 코드 완전 종료
            window.location.href = 'index.html';
            forceHideBody();
            return; // 👈 2번 조건을 검사하지 못하도록 여기서 원천 차단!
        }

        // 2. [회원 로그인 통과 후 검사] 글쓰기 전용 0506 비밀번호 인증 상태 체크
        const isAuth = localStorage.getItem('adminAuthenticated');
        if (isAuth !== 'true') {
            // 회원 로그인은 되어있으나 0506을 뚫지 않고 주소창으로 직접 친 유저는 아카이브 메인으로 추방
            window.location.href = 'archive.html';
            forceHideBody();
            return;
        }

        // 화면 번쩍임 철저 방어용 헬퍼 함수
        function forceHideBody() {
            const style = document.createElement('style');
            style.innerHTML = 'body { display: none !important; }';
            document.head.appendChild(style);
        }
    })();
</script>
</head>
<body>
    <header class="write-header">
        <a href="javascript:history.back()" class="header-back-btn">←</a>
        <div class="header-right">
            <span id="word-count" class="word-count">0자</span>
            <div class="header-buttons">
                <button id="publish-btn" class="publish-btn">발행</button>
            </div>
        </div>
    </header>

    <main class="write-container">
        <div class="editor-toolbar">
            <div class="toolbar-left">
                <button type="button" class="toolbar-button" data-command="undo" title="되돌리기">
                    <i class="fas fa-undo-alt"></i>
                </button>
                <button type="button" class="toolbar-button" data-command="redo" title="다시 실행">
                    <i class="fas fa-redo-alt"></i>
                </button>
                <span class="toolbar-separator"></span>
            </div>
            <div class="toolbar-center">
                <button type="button" class="toolbar-button" data-command="bold" title="굵게">
                    <b>B</b>
                </button>
                <button type="button" class="toolbar-button" data-command="italic" title="기울임꼴">
                    <i>I</i>
                </button>
                <button type="button" class="toolbar-button" data-command="underline" title="밑줄">
                    <u>U</u>
                </button>
                <button type="button" class="toolbar-button" data-command="strikeThrough" title="취소선">
                    S
                </button>
                <span class="toolbar-separator"></span>
                <button type="button" class="toolbar-button" data-command="createLink" title="링크 삽입">
                    🔗
                </button>
                <button type="button" class="toolbar-button" id="insertImageBtn" title="이미지 추가">
                    img
                </button>
                <span class="toolbar-separator"></span>
                <button type="button" class="toolbar-button" data-command="insertUnorderedList" title="글머리 기호">
                    •
                </button>
                <button type="button" class="toolbar-button" data-command="insertOrderedList" title="번호 매기기">
                    1.2.3
                </button>
                <button type="button" class="toolbar-button" data-command="insertHorizontalRule" title="구분선 추가">
                    —
                </button>
            </div>
            <div class="toolbar-right">
                <span class="toolbar-separator"></span>
                <button type="button" class="toolbar-button" data-command="justifyLeft" title="왼쪽 정렬">
                    ◧
                </button>
                <button type="button" class="toolbar-button" data-command="justifyCenter" title="가운데 정렬">
                    ◪
                </button>
                <button type="button" class="toolbar-button" data-command="justifyRight" title="오른쪽 정렬">
                    ◨
                </button>
            </div>
        </div>

        <form id="write-form">
            <div class="title-container">
                <input type="text" id="post-title" class="title-input" placeholder="제목을 입력하세요">
                <input type="text" id="post-author" class="author-input" placeholder="작가명을 입력하세요">
                <input type="text" id="post-series" class="series-input" placeholder="시리즈명 (선택사항)">
            </div>

            <div id="post-content" class="editable-area" contenteditable="true" placeholder="글 내용을 입력하세요"></div>

            <input type="file" id="imageInput" accept="image/*" style="display: none;">
        </form>
    </main>
    <script src="write.js"></script>
</body>
</html>
