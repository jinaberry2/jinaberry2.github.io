<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #faf8f5; /* 기존 아카이브의 아늑하고 고급스러운 소프트 크림 베이지 무드 */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); /* 과하지 않고 은은한 그림자 감성 */
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            border: 1px solid #f0ede8;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #2b2b2b;
            text-align: center;
            letter-spacing: -0.02em;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #6e6a64;
            letter-spacing: -0.01em;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e4e0d8;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fdfcfb;
            color: #333;
            transition: all 0.2s ease;
        }
        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: #c4beb3;
        }
        input:focus {
            border-color: #8c857b; /* 은은한 토프 브라운/그레이 계열 초점 색상 */
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(140, 133, 123, 0.08);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #3a3630; /* 깊이감 있는 세련된 웜 다크 차콜 */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 12px;
            letter-spacing: -0.01em;
            transition: background-color 0.2s ease;
        }
        .btn-login:hover {
            background-color: #272420;
        }
        .links-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            font-size: 0.85rem;
        }
        .links-container a {
            color: #8c857b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .links-container a:hover {
            color: #3a3630;
            text-decoration: underline;
        }
    </style>
    
    <!-- 🌟 무한 핑퐁 루프를 완전히 파쇄하는 강력한 유령 캐시 판독 가드 -->
    <script>
        (function() {
            const rawData = localStorage.getItem('loggedInUser');
            
            // 데이터가 아예 없거나 깨진 유령 텍스트 문자열이 박혀있다면 
            // 가차없이 다 밀어버리고 리다이렉트를 취소한 후 로그인 대기 모드로 멈춥니다.
            if (!rawData || rawData === 'null' || rawData === 'undefined' || rawData === '{}' || rawData === '""') {
                localStorage.removeItem('loggedInUser');
                return; 
            }

            try {
                const user = JSON.parse(rawData);
                // 객체 내부의 핵심 필드(username)까지 확실하게 차 있는 실체 데이터인 경우만 통과
                if (user && user.username) {
                    window.location.href = 'archive.html';
                    forceHide();
                    return;
                }
            } catch (e) {
                // 조금이라도 에러 요소가 포착되면 리셋
                localStorage.removeItem('loggedInUser');
            }
            
            function forceHide() {
                const style = document.createElement('style');
                style.innerHTML = 'body { display: none !important; }';
                document.head.appendChild(style);
            }
        })();
    </script>
</head>
<body>

<div class="login-container">
    <h2>멤버 로그인</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" placeholder="아이디를 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <button type="submit" class="btn-login">로그인</button>
    </form>
    <div class="links-container">
        <a href="signup.html">신규 회원가입 신청 →</a>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/.netlify/functions/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                // 검증된 완전한 유저 데이터만 스토리지에 깨끗하게 직렬화하여 저장
                localStorage.setItem('loggedInUser', JSON.stringify(result.user));
                window.location.href = 'archive.html'; 
            } else {
                alert(result.message || '로그인 실패');
            }
        } catch (error) {
            console.error('로그인 서버 통신 에러:', error);
            alert('서버와 통신 중 문제가 발생했습니다.');
        }
    });
</script>

</body>
</html>
